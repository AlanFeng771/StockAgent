[project]
name = "stockagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.142.2",
    "finmind>=2.0.10",
    "openai>=3.22.1",
    "pandas>=2.3.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.1.1",
    "ta>=0.11.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.16.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
